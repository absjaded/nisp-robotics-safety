[project]
name = "nisp"
version = "0.1.0"
description = "Neuromorphic Intent-Safety Pipeline"
requires-python = ">=3.10"
dependencies = [
    "mujoco>=3.7.0",
    "numpy>=2.2.3",
    "pyyaml>=6.0.2",
    "pytest>=8.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
