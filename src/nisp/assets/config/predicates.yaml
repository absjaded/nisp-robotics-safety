predicates:
  - index: 0
    name: "proximity_violation"
    display: "Collision Imminent"
    tier: 1
    telemetry_channels: ["min_dist"]
    threshold_key: "proximity"
    lean4_field: "proximity_violation"
    description: "Closing distance below safe stopping margin"

  - index: 1
    name: "torque_exceedance"
    display: "Lane Breach"
    tier: 1
    telemetry_channels: ["tau_0", "tau_1", "tau_2", "tau_3", "tau_4", "tau_5"]
    threshold_key: "torque"
    lean4_field: "torque_violation"
